<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151a17"><title>Military Physique</title><style>
:root{--bg:#101411;--panel:#1a211c;--line:#344137;--text:#f2f3ed;--muted:#aab4a9;--olive:#a8bd83}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:24px 18px;background:#202a22;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--olive);font-weight:800}.brand{font-size:25px;font-weight:900;margin:6px 0}.muted{color:var(--muted);font-size:13px;line-height:1.5}main{padding:16px 14px 100px;max-width:700px;margin:auto}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#171d19;border-top:1px solid var(--line);padding:10px 4px calc(10px + env(safe-area-inset-bottom))}.tabs button{background:none;border:0;color:var(--muted);font-size:12px}.tabs button.active{color:var(--olive)}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0}.hero{background:linear-gradient(130deg,#29372b,#1b241d)}h2{font-size:22px;margin:5px 0 12px}h3{font-size:16px;margin:0 0 8px}.btn{background:#28352c;border:1px solid #526347;color:var(--text);border-radius:10px;padding:12px;font-weight:700}.primary{background:var(--olive);color:#182018;border-color:var(--olive)}.full{width:100%;margin-top:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:11px;border:1px solid #59694c;border-radius:99px;padding:5px 8px;color:var(--olive)}.exercise{padding:12px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border:0}.exercise label{display:flex;gap:10px}.exercise input{accent-color:var(--olive);width:18px;height:18px}.exercise small{display:block;color:var(--muted);margin-top:5px}.timer{text-align:center;font-size:40px;font-weight:900;color:var(--olive);padding:10px}input,select{width:100%;padding:11px;margin:5px 0 12px;background:#111713;color:var(--text);border:1px solid var(--line);border-radius:9px}.field{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#222b24;border-radius:12px;padding:12px}.stat strong{display:block;font-size:24px}.stat span{font-size:11px;color:var(--muted)}.note{background:#28271e;border:1px solid #615b3c;border-radius:10px;padding:12px;color:#e3d6b1;font-size:12px;line-height:1.5}
</style></head><body><header><div class="eyebrow">DISCIPLINE • CONSISTENCY • PROGRESS</div><div class="brand">MILITARY PHYSIQUE</div><div class="muted">Build strength. Track the mission.</div></header><main id="app"></main><nav class="tabs"><button class="active" data-tab="home">⌂ Home</button><button data-tab="workouts">⚔ Workouts</button><button data-tab="progress">▥ Progress</button><button data-tab="photos">▣ Photos</button><button data-tab="settings">⚙ Settings</button></nav><script>
const workouts=[
["MONDAY • ARMOR","Chest + triceps • quads",[["Push-ups","12–20 reps"],["Dumbbell floor press","10–12 reps"],["Close-grip push-ups","8–15 reps"],["Goblet squat","12–15 reps"],["Overhead triceps extension","12 reps"],["Lateral raise","15 reps"],["Wall sit","45 seconds"]]],
["TUESDAY • WINGS","Back + biceps • hamstrings",[["One-arm dumbbell row","12 each side"],["Bent-over dumbbell row","12 reps"],["Romanian deadlift","12 reps"],["Hammer curl","12 reps"],["Dumbbell curl","10 reps"],["Rear-delt fly","15 reps"],["Standing hamstring curl","15 each leg"]]],
["WEDNESDAY • SOLDIER","Full body • legs",[["Push-ups","10 reps"],["Bodyweight squats","15 reps"],["One-arm row","10 each side"],["Shoulder press","10 reps"],["Calf raises","20 reps"],["Standing knee drives","20 total"],["Plank","30 seconds"]]],
["THURSDAY • GUNS & SHOULDERS","Shoulders + arms • posterior chain",[["Shoulder press","10–12 reps"],["Lateral raise","15 reps"],["Rear-delt fly","15 reps"],["Dumbbell curl","10–12 reps"],["Hammer curl","10 reps"],["Overhead triceps extension","12 reps"],["Romanian deadlift","10 reps"],["Glute bridge","15 reps"]]],
["FRIDAY • COMMANDER","Full-body strength • legs",[["Push-ups","15 reps"],["One-arm row","12 each side"],["Shoulder press","10 reps"],["Lateral raise","15 reps"],["Goblet squat","15 reps"],["Romanian deadlift","12 reps"],["Dumbbell curl","10 reps"],["Calf raises","20 reps"],["Side leg raises","10 each side"]]]
];
const K="mp_free_v1";let d={history:[],measurements:[],prs:[],checks:{},photos:[],unit:"lb"};try{d={...d,...JSON.parse(localStorage.getItem(K)||"{}")}}catch(e){}let tab="home",selected=0,seconds=0,interval=null,running=false;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(d))}catch(e){alert("Browser storage is full. Try smaller photos or export your data.")}};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const time=()=>String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
function go(t){tab=t;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
function render(){let a=document.getElementById("app");if(tab==="home")a.innerHTML=`<div class="card hero"><span class="pill">YOUR MISSION STARTS HERE</span><h2>Earn your progress.</h2><p class="muted">Train with control. Record each session. Build consistency one day at a time.</p><button class="btn primary full" data-a="today">START TODAY'S WORKOUT</button></div><div class="card"><h3>12-week plan • Phase 4 starter</h3><p class="muted">Five evening sessions using dumbbells and a sturdy chair.</p><button class="btn full" data-a="plans">View workouts</button></div><div class="grid"><div class="stat"><strong>${d.history.length}</strong><span>WORKOUTS LOGGED</span></div><div class="stat"><strong>${d.prs.length}</strong><span>PERSONAL RECORDS</span></div></div>`;if(tab==="workouts")a.innerHTML=selected===-1?workoutDetail():`<h2>Training plan</h2><p class="muted">Phase 4 • 12-week plan. Begin with fewer rounds if restarting and increase gradually.</p>${workouts.map((w,i)=>`<div class="card"><div class="row"><h3>${w[0]}</h3><span class="pill">${w[2].length} moves</span></div><p class="muted">${w[1]}</p><button class="btn full" data-a="open" data-i="${i}">Open workout</button></div>`).join("")}<div class="note">Use controlled reps and comfortable ranges. Stop for sharp pain, chest pain, dizziness, or unusual shortness of breath.</div>`;if(tab==="progress")a.innerHTML=`<h2>Progress report</h2><div class="grid"><div class="stat"><strong>${d.history.length}</strong><span>SESSIONS</span></div><div class="stat"><strong>${d.prs.length}</strong><span>PERSONAL RECORDS</span></div></div><div class="card"><h3>Body measurements</h3><form id="mf"><label class="field">Date<input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label class="field">Weight (${d.unit})<input name="weight" type="number" step=".1" placeholder="e.g. 230"></label><label class="field">Waist (inches)<input name="waist" type="number" step=".1"></label><button class="btn primary full">Save measurement</button></form></div><div class="card"><h3>Personal record</h3><form id="pf"><label class="field">Exercise<input name="exercise" required placeholder="Dumbbell row"></label><label class="field">Weight (${d.unit})<input name="weight" type="number" required step=".5"></label><label class="field">Reps<input name="reps" type="number" min="1" required></label><button class="btn primary full">Save record</button></form></div><div class="card"><h3>Recent history</h3>${d.history.slice().reverse().map(x=>`<div class="exercise"><strong>${esc(x.name)}</strong><small>${esc(x.date)} • ${esc(x.duration)}</small></div>`).join("")||'<p class="muted">Complete a workout to begin your history.</p>'}</div><div class="card"><h3>Measurements</h3>${d.measurements.slice().reverse().map(x=>`<div class="exercise"><strong>${esc(x.date)} — ${x.weight?esc(x.weight)+" "+d.unit:"No weight entered"}</strong><small>${x.waist?"Waist: "+esc(x.waist)+" in":""}</small></div>`).join("")||'<p class="muted">No measurements yet.</p>'}</div>`;if(tab==="photos")a.innerHTML=`<h2>Progress photos</h2><p class="muted">Photos are saved in this browser on this device when storage allows. This is not cloud backup.</p><div class="card"><label class="field">Checkpoint<select id="cp"><option>Start</option><option>Week 4</option><option>Week 8</option><option>Week 12</option></select></label><label class="field">Choose photo<input id="photo" type="file" accept="image/*"></label><button class="btn primary full" data-a="photo">Save checkpoint photo</button></div><div class="grid">${d.photos.slice().reverse().map((p,i)=>`<div class="card"><img src="${p.src}" style="width:100%;border-radius:8px"><strong>${esc(p.cp)}</strong><p class="muted">${esc(p.date)}</p><button class="btn" data-a="delphoto" data-i="${d.photos.length-1-i}">Delete</button></div>`).join("")}</div>`;if(tab==="settings")a.innerHTML=`<h2>Settings & backup</h2><div class="card"><label class="field">Weight units<select id="unit"><option value="lb" ${d.unit==="lb"?"selected":""}>Pounds (lb)</option><option value="kg" ${d.unit==="kg"?"selected":""}>Kilograms (kg)</option></select></label><button class="btn full" data-a="unit">Save preference</button></div><div class="card"><h3>Data backup</h3><p class="muted">Your data stays in this browser and will not sync between devices. Export a backup before clearing browser data.</p><button class="btn full" data-a="export">Export my data</button><button class="btn full" data-a="import">Import backup</button><input id="backup" type="file" accept="application/json" hidden></div><div class="note">This is a starter web app, not a native App Store app. Progress photos and records are stored locally on this device.</div>`;bind()}
function workoutDetail(){let w=workouts[selected];return `<button class="btn" data-a="back">← Workouts</button><h2>${w[0]}</h2><p class="muted">${w[1]}</p><div class="card">${w[2].map((e,i)=>`<div class="exercise"><label><input type="checkbox" data-c="${selected}-${i}" ${d.checks[selected+"-"+i]?"checked":""}><span><strong>${e[0]} — ${e[1]}</strong><small>Keep each rep controlled and use a manageable variation.</small></span></label></div>`).join("")}</div><div class="card"><h3>Elapsed timer</h3><div class="timer" id="timer">${time()}</div><div class="grid"><button class="btn" data-a="toggle">${running?"Pause":"Start timer"}</button><button class="btn" data-a="reset">Reset</button></div></div><button class="btn primary full" data-a="finish">FINISH & LOG WORKOUT</button>`}
function bind(){document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.i));document.querySelectorAll("[data-c]").forEach(c=>c.onchange=()=>{d.checks[c.dataset.c]=c.checked;save()});let mf=document.getElementById("mf");if(mf)mf.onsubmit=e=>{e.preventDefault();let f=new FormData(mf);d.measurements.push({date:f.get("date"),weight:f.get("weight"),waist:f.get("waist")});save();render()};let pf=document.getElementById("pf");if(pf)pf.onsubmit=e=>{e.preventDefault();let f=new FormData(pf);d.prs.push({exercise:f.get("exercise"),weight:f.get("weight"),reps:f.get("reps"),date:new Date().toLocaleDateString()});save();render()}}
function act(a,i){if(a==="plans")go("workouts");if(a==="today"){selected=(new Date().getDay()+6)%7;selected=Math.min(selected,4);go("workouts");selected=Math.min((new Date().getDay()+6)%7,4);render()}if(a==="open"){selected=+i;render()}if(a==="back"){selected=0;render()}if(a==="toggle"){if(running){clearInterval(interval);running=false}else{running=true;interval=setInterval(()=>{seconds++;let t=document.getElementById("timer");if(t)t.textContent=time()},1000)}render()}if(a==="reset"){clearInterval(interval);running=false;seconds=0;render()}if(a==="finish"){clearInterval(interval);running=false;d.history.push({name:workouts[selected][0],date:new Date().toLocaleDateString(),duration:time()});save();seconds=0;go("progress")}if(a==="unit"){d.unit=document.getElementById("unit").value;save();render()}if(a==="export"){let u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));let x=document.createElement("a");x.href=u;x.download="military-physique-backup.json";x.click();URL.revokeObjectURL(u)}if(a==="import")document.getElementById("backup").click();if(a==="photo"){let f=document.getElementById("photo").files[0];if(!f){alert("Choose a photo first.");return}if(f.size>1500000){alert("Choose a smaller photo to avoid filling browser storage.");return}let r=new FileReader();r.onload=()=>{d.photos.push({cp:document.getElementById("cp").value,date:new Date().toLocaleDateString(),src:r.result});save();render()};r.readAsDataURL(f)}if(a==="delphoto"){if(confirm("Delete this photo?")){d.photos.splice(+i,1);save();render()}}}
document.addEventListener("change",e=>{if(e.target.id==="backup"&&e.target.files[0]){let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(confirm("Replace current local data with this backup?")){d=v;save();render()}}catch(e){alert("Unable to read backup file.")}};r.readAsText(e.target.files[0])}});
render();
</script></body></html>
